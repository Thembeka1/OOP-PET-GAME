<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pet Clicker Game</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>

  <h1>🐶🐱Pet Clicker Game</h1>

  <p>Pick your pet:</p>
  <button onclick="choosePet('dog')">Dog</button>
  <button onclick="choosePet('cat')">Cat</button>

  <div id="game" style="display: none;">
    <img 
      id="petImage" 
      class="pet" 
      src="images.jpg"
      alt="Your Pet" 
      onclick="playWithPet()"
    >
    
    <div id="counter">Times played: 0</div>
    <div id="actions"></div>
  </div>
  

  <script>
    // Define global variables
let playCount = 0;
let currentPet = '';

// Handle pet selection
function choosePet(pet) {
  currentPet = pet;

  // Set pet image based on selection
  const petImage = document.getElementById('petImage');
  petImage.src = pet === 'dog' ? 'images.jpg' : 'images/images-1.jpg';

  // Show the game area
  document.getElementById('game').style.display = 'block';

  // Reset play count
  playCount = 0;
  updateCounter();
}

// Handle playing with the pet
function playWithPet() {
  playCount++;
  updateCounter();

  // Optional: Add animation or feedback
  const actionsDiv = document.getElementById('actions');
  actionsDiv.innerHTML = `<p>You played with your ${currentPet}!</p>`;

  // Clear message after 1.5 seconds
  setTimeout(() => {
    actionsDiv.innerHTML = '';
  }, 1500);
}

// Update the counter display
function updateCounter() {
  const counter = document.getElementById('counter');
  counter.textContent = `Times played: ${playCount}`;
}

  </script>
</body>
</html>
