<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pet Clicker Game</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
    <nav>
    <h1>🐶🐱🦜🐓Pet Clicker Game</h1>

    
       <a href="Home">Home</a> 
       <a href="PetImages">PetImages</a>
      <a href="Choosepets">Choosepets</a>
      <a href="PetSounds">PetSounds</a>

      </nav>

  <p>Pick your pet:</p>
  <button onclick="choosePet('dog')">Dog</button>
  <button onclick="choosePet('cat')">Cat</button>
  <button onclick="choosePet('Bird')">Bird</button>
  <button onclick="choosePet('Chicken')">Chicken</button>

  <section id="game" style="display: none;">
    <img 
      id="petImage" 
      class="pet" 
      src="images/images-0.jpg"
      alt="Your Pet" 
      onclick="playWithPet()"
    >
    
    <section id="counter">Times played: 0</section>
    <section id="actions"></section>
  </section>

  <script>
let currentPet = null;
let currentSound = null;

function choosePet(pet) {
  currentPet = pet;

      const petImage = document.getElementById('petImage');
      switch (pet) {
        case 'dog':
          petImage.src = 'images/images-0.jpg';
          currentSound = new Audio('Media/dog-barks-75750.mp3')
          break;
        case 'cat':
          petImage.src = 'images/images-1.jpg';
          currentSound = new Audio('Media/cat-meow-321642.mp3')
          break;
        case 'Chicken':
          petImage.src = 'images/download-1.jpg';
          currentSound = new Audio('Media/chicken-soundscape-200111.mp3')
          break;
        case 'Bird':
          petImage.src = 'images/download.jpg';
          currentSound = new Audio('Media/bird-333090.mp3')
          break;
        default:
          petImage.src = 'images/default.jpg';
          currentSound= null
      }
   
      document.getElementById('game').style.display = 'block';

      playCount = 0;
      updateCounter();
    }

  
    function playWithPet() {
  playCount++;
  updateCounter();

  if (currentSound) {
    currentSound.currentTime = 0; 
    currentSound.play();
  }
      const actionsDiv = document.getElementById('actions');
      actionsDiv.innerHTML = `<p>You played with your ${currentPet}!</p>`;

      setTimeout(() => {
        actionsDiv.innerHTML = '';
      }, 1500);
    }

    // Update counter display
    function updateCounter() {
      document.getElementById('counter').textContent = `Times played: ${playCount}`;
    }
</script>
</body>
</html>
